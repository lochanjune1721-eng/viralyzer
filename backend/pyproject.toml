[project]
name = "viralyzer-backend"
version = "0.1.0"
description = "Viralyzer ideation + scripting service: Postgres schema, storage and retrieval layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "langgraph-checkpoint-postgres>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

# The rest of the fixed stack (langgraph, deepagents, fastapi, arq, redis) is
# added by the graph / API / worker slices; this slice is storage only.

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
viralyzer-db = "viralyzer.db.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viralyzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:viralyzer.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
